<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu" class="menu">
        <h1>DUELLE</h1>
        <p>Multiplayer Wordle</p>
        <div class="menu-buttons">
            <button id="create-room-btn" class="menu-btn">Create Room</button>
            <button id="join-room-btn" class="menu-btn">Join Room</button>
        </div>
        <div id="join-input-container" class="join-input-container hidden">
            <input type="text" id="room-code-input" placeholder="Enter room code" maxlength="6">
            <button id="join-submit-btn" class="menu-btn">Join</button>
        </div>
    </div>

    <div id="game" class="container hidden">
        <header>
            <h1>DUELLE</h1>
        </header>

        <div class="game-info">
            <span id="opponent-info">Opponent: 0/6</span>
            <span id="room-code">Room: -</span>
            <span id="timer">0:00</span>
        </div>
        
        <div id="board" class="board"></div>

        <div id="message" class="message"></div>
        <div id="keyboard" class="keyboard">
            <div class="keyboard-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key key-large" data-key="Enter">ENTER</button>
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
                <button class="key key-large" data-key="Backspace">DEL</button>
            </div>  
        </div>
        <button id="stats-btn" class="stats-btn">Stats</button>
    </div>
    <div class="modal hidden" id="stats-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Statistics</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="games-played">0</div>
                    <div class="stat-label">Played</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="win-percent">0</div>
                    <div class="stat-label">Win %</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="current-streak">0</div>
                    <div class="stat-label">Streak</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avg-guesses">0</div>
                    <div class="stat-label">Avg</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
