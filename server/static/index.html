<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu" class="menu">
        <h1>DUELLE</h1>
        <p>Multiplayer Wordle</p>
        <div class="menu-buttons">
            <button id="create-room-btn" class="menu-btn">Create Room</button>
            <button id="join-room-btn" class="menu-btn">Join</button>
        </div>
   
    </div>

    <div id="game" class="container hidden">
        <header>
            <h1>DUELLE</h1>
        </header>
        <div class="game-info">
            <span id="opponent-info">Opponent: 0/6</span>
            <span id="room-code">Room: </span>
            <span id="timer">0:00</span>
        </div>

        <div id="board" class="board"></div>
        <div id="message" class="message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
